[project]
name = "ebiz-deployment-local-evidence-fixture"
version = "1.0.0"
description = "Deterministic-local-only governed evidence fixture for eBizHub deployment tests."
requires-python = ">=3.11,<3.13"
dependencies = ["ebizhub-agent-runtime==0.1.5"]

[project.entry-points."ebiz_agents.providers"]
"deployment.fixture.governed-artifact" = "ebiz_deployment_local_fixture.plugin:factory"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebiz_deployment_local_fixture"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "ebiz_deployment_local_fixture/contracts"

