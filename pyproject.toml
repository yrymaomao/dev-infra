[project]
name = "ebiz-deployment-composition"
version = "0.1.0"
description = "Production composition launcher for eBizHub Agent Runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
  "base-ai>=0.1,<0.2",
  "ebizhub-agent-runtime[base-ai]>=0.1,<0.2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.scripts]
ebiz-runtime-deployment = "ebiz_deployment.launcher:main"
ebiz-runtime-attestation = "ebiz_deployment.attestation:main"
ebiz-supply-chain-live-smoke = "ebiz_deployment.supply_chain_live:main"
ebiz-local-dev-providers = "ebiz_deployment.local_dev_services:main"
ebiz-local-dev-assets = "ebiz_deployment.local_dev_assets:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# TEMPORARY wiring for the capability-publisher extraction (Task 5): install the
# Runtime from the in-review worktree because the frozen v1.2 wheelhouse wheel
# predates agent_runtime.registry.capability_manifest/capability_publication.
# Revert to the wheelhouse-published wheel once the publisher lands on the
# Runtime mainline and a new wheel is built.
[tool.uv.sources]
ebizhub-agent-runtime = { path = "C:/ebizhub/worktrees/ebizhub-agent-runtime-capability-publisher/packages/agent_runtime" }

# The worktree package declares development-only tool.uv.sources (a neutral
# base-ai test fixture, editable contracts/workflow paths). Supplying its
# metadata statically keeps resolution on the frozen wheelhouse artifacts for
# base-ai, ebiz-runtime-contracts, and ebiz-workflow-runtime.
[[tool.uv.dependency-metadata]]
name = "ebizhub-agent-runtime"
version = "0.1.0"
requires-dist = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "ebiz-runtime-contracts",
  "ebiz-workflow-runtime",
  "fastapi>=0.128,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.26,<4.27",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "PyYAML>=6,<7",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2,<3",
  "base-ai>=0.1,<0.2; extra == 'base-ai'",
]
provides-extras = ["base-ai"]

[tool.hatch.build.targets.wheel]
packages = ["src/ebiz_deployment"]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]
contract = [
  "boto3==1.43.75",
  "botocore==1.43.75",
  "ebiz-adapter-erp==0.1.0",
  "ebiz-adapter-mcp==0.1.0",
  "ebiz-adapter-model-openai==0.1.0",
  "ebiz-agent-inventory-supply-chain==1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.test-artifacts"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
