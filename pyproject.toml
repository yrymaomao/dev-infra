[project]
name = "ebiz-deployment-composition"
version = "0.1.4"
description = "Production composition launcher for eBizHub Agent Runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aio-pika>=9.5,<10",
  "base-ai==0.1.1",
  "ebizhub-agent-runtime[base-ai]==0.1.6",
  "ebiz-runtime-contracts==0.1.6",
  "ebiz-workflow-runtime==0.1.6",
  "ebiz-agent-inventory-supply-chain==4.1.0",
  "httpx>=0.28,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.128,<1",
  "jsonschema>=4.26,<4.27",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
ebiz-runtime-deployment = "ebiz_deployment.launcher:main"
ebiz-runtime-attestation = "ebiz_deployment.attestation:main"
ebiz-supply-chain-live-smoke = "ebiz_deployment.supply_chain_live:main"
ebiz-local-dev-providers = "ebiz_deployment.local_dev_services:main"
ebiz-local-dev-assets = "ebiz_deployment.local_dev_assets:main"
ebiz-local-dev-skill-seed = "ebiz_deployment.local_skill_seed:main"
ebiz-release-material-guard = "ebiz_deployment.release_material_guard:main"
ebiz-model-seam-release = "ebiz_deployment.model_seam_release:main"
ebiz-supply-chain-bff = "ebiz_deployment.supply_chain_bff.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv]
find-links = ["wheelhouse"]

# Private package metadata is declared for deterministic locking. Release
# assembly still requires exact wheel pins and never resolves these packages
# from source paths or editable installs.
[[tool.uv.dependency-metadata]]
name = "ebizhub-agent-runtime"
version = "0.1.6"
requires-dist = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "ebiz-runtime-contracts",
  "ebiz-workflow-runtime",
  "fastapi>=0.128,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.26,<4.27",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.29,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "PyYAML>=6,<7",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2,<3",
  "base-ai==0.1.1; extra == 'base-ai'",
]
provides-extras = ["base-ai"]

[[tool.uv.dependency-metadata]]
name = "ebiz-capability-supply-chain"
version = "3.0.0"
requires-dist = ["ebizhub-agent-runtime>=0.1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ebiz_deployment"]

[tool.hatch.build.targets.wheel.force-include]
"bff-alembic.ini" = "ebiz_deployment/supply_chain_bff/alembic.ini"
"bff_migrations" = "ebiz_deployment/supply_chain_bff/migrations"
"contracts/supply-chain-level2" = "ebiz_deployment/supply_chain_bff/contracts/level2"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.26,<5",
  "types-PyYAML>=6,<7",
]
contract = [
  "boto3==1.43.75",
  "botocore==1.43.75",
  "ebiz-adapter-erp==0.2.0",
  "ebiz-adapter-mcp==0.1.0",
  "ebiz-adapter-model-openai==0.1.1",
  "ebiz-agent-inventory-supply-chain==4.1.0",
  "ebiz-capability-inventory-catalog==4.0.0",
  "ebiz-capability-commerce-sales-catalog==4.0.0",
  "ebiz-capability-supply-chain==3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.test-artifacts"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
